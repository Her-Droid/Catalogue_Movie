plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
}

android {
    compileSdk 32

    defaultConfig {
        applicationId "com.freisia.cataloguemoviedb"
        minSdk 23
        targetSdk 32
        versionCode 1
        versionName "1.0"
        buildConfigField 'String', 'BASE_URL', '"https://api.themoviedb.org/3/"'
        buildConfigField 'String', 'BASE_IMAGE_URL', '"https://image.tmdb.org/t/p/w500"'
        buildConfigField 'String', 'API_KEY', '"56122b0993fab6d548a8dc8b5197fd44"'
        buildConfigField 'String', 'YOUTUBE_URL', '"https://www.youtube.com/watch?v="'
        buildConfigField 'String', 'VIMEO_URL', '"https://vimeo.com/"'
        buildConfigField 'String', 'YOUTUBE_IMAGE_URL', '"https://img.youtube.com/vi/"'
        buildConfigField 'String', 'VIMEO_IMAGE_URL', '"https://vumbnail.com/"'
        testInstrumentationRunner "com.freisia.cataloguemoviedb.TestRunner"

        ndk {
            abiFilters 'x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
    }
    splits {
        abi {
            enable true
            reset()
            include 'x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a'
            universalApk true
        }
    }

    configurations.all {
        resolutionStrategy.dependencySubstitution {
            substitute module('org.hamcrest:hamcrest-core:1.3') with module('org.hamcrest:hamcrest:2.2')
            substitute module('org.hamcrest:hamcrest-library:1.3') with module('org.hamcrest:hamcrest:2.2')

        }
    }


}

dependencies {

    //androidx
    implementation 'androidx.core:core-ktx:1.7.0'
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    //ui
    implementation 'com.google.android.material:material:1.5.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.3'
    // navigation
    implementation 'androidx.navigation:navigation-fragment-ktx:2.4.1'
    implementation 'androidx.navigation:navigation-ui-ktx:2.4.1'
    //lifecycle
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.4.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.4.1'
    //network
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.9.0'
    // image view
    implementation 'com.github.bumptech.glide:glide:4.12.0'
    kapt 'com.github.bumptech.glide:compiler:4.12.0'
    implementation "com.flaviofaria:kenburnsview:1.0.7"
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    //text read more
    implementation "com.github.bravoborja:ReadMoreTextView:2.1.0"
    //shimmer
    implementation 'com.facebook.shimmer:shimmer:0.5.0'
    //lottie
    implementation 'com.airbnb.android:lottie:3.6.0'
    //percentage view
    implementation 'com.github.RamiJ3mli:PercentageChartView:0.3.1'
    //dependency injection
    implementation 'com.google.dagger:dagger:2.40.1'
    kapt 'com.google.dagger:dagger-compiler:2.40.1'
    kapt 'com.google.dagger:dagger-android-processor:2.40.1'
    // security
    implementation "androidx.security:security-crypto:1.1.0-alpha03"
    //paging
    implementation "androidx.paging:paging-runtime-ktx:3.1.1"
    // video player
    implementation 'com.google.android.exoplayer:exoplayer:2.17.1'
    implementation 'com.github.kishansinghpanwar:AutoPlayer:v1.0.0'
    // video extractor
    implementation 'com.github.yausername.youtubedl-android:library:0.13.1'
    // reactive programming
    implementation "io.reactivex.rxjava3:rxandroid:3.0.0"
    // idling resource espresso
    implementation 'androidx.test.espresso:espresso-idling-resource:3.4.0'
    //unit test
    testImplementation 'junit:junit:4.13.2'
    //ui test / instrumentation test
    androidTestImplementation 'androidx.test:runner:1.4.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
    androidTestImplementation 'com.squareup.okhttp3:mockwebserver:4.9.1'
    androidTestImplementation 'com.jakewharton.espresso:okhttp3-idling-resource:1.0.0'
    androidTestImplementation 'org.mockito:mockito-core:4.4.0'
    androidTestImplementation 'org.mockito:mockito-android:4.4.0'
    //dagger test
    kaptAndroidTest "com.google.dagger:dagger-compiler:2.40.1"
}